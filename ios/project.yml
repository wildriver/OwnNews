name: OwnNews
options:
  bundleIdPrefix: com.arakawalab
  deploymentTarget:
    iOS: "16.4"
targets:
  OwnNews:
    type: application
    platform: iOS
    sources: [OwnNews]
    entitlements:
      path: OwnNews/OwnNews.entitlements
      properties:
        aps-environment: development
    info:
      path: OwnNews/Info.plist
      properties:
        CFBundleDisplayName: OwnNews
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIViewControllerBasedStatusBarAppearance: true
    settings:
      base:
        # com.arakawalab.ownnews は誤って旧アカウント(無料チーム)に登録され使用不可になったため変更
        PRODUCT_BUNDLE_IDENTIFIER: com.arakawa-lab.ownnews
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LP34H67XY3
