<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif">
  <defs>
    <pattern id="emb" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#000" stroke-width="1.4" opacity="0.42"/>
    </pattern>
    <pattern id="meta" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.9" fill="#000" opacity="0.34"/>
    </pattern>
  </defs>

  <!-- (a) 1パックの内訳 -->
  <text x="24" y="26" font-size="13.5" font-weight="bold">(a) 記事パック1回分の内訳（800記事・生 1.78 MB）</text>

  <rect x="24" y="42" width="452" height="44" fill="url(#emb)" stroke="#000" stroke-width="1.4"/>
  <rect x="476" y="42" width="320" height="44" fill="url(#meta)" stroke="#000" stroke-width="1.4"/>

  <text x="250" y="70" font-size="12.5" text-anchor="middle" font-weight="bold">量子化埋め込み 58.6%</text>
  <text x="636" y="70" font-size="12.5" text-anchor="middle" font-weight="bold">メタデータ 41.4%</text>
  <text x="250" y="104" font-size="11" text-anchor="middle">1,368 B/記事（実体1,026 B ≒ 1 byte/次元）</text>
  <text x="636" y="104" font-size="11" text-anchor="middle">968 B/記事（表題・要約・栄養素ほか）</text>

  <g font-size="11.5">
    <text x="24" y="134">生 1,869,146 B　→　gzip 892,041 B　→　Brotli 863,037 B（圧縮率 2.2倍）</text>
    <text x="24" y="152" font-size="10.5" opacity="0.8">量子化済み埋め込みは実質的に乱数列であり圧縮の余地が小さい。サイズの下限は次元数×記事数でほぼ決まる。</text>
  </g>

  <line x1="24" y1="168" x2="836" y2="168" stroke="#000" stroke-width="1" opacity="0.3"/>

  <!-- (b) 規模 -->
  <text x="24" y="192" font-size="13.5" font-weight="bold">(b) 端末が保持する集合の規模</text>

  <g font-size="11.5">
    <line x1="24" y1="208" x2="836" y2="208" stroke="#000" stroke-width="1.2"/>
    <text x="34" y="226" font-weight="bold">保持する範囲</text>
    <text x="300" y="226" font-weight="bold" text-anchor="end">記事数</text>
    <text x="470" y="226" font-weight="bold" text-anchor="end">IndexedDB</text>
    <text x="700" y="226" font-weight="bold" text-anchor="end">再計算1回の積和</text>
    <line x1="24" y1="234" x2="836" y2="234" stroke="#000" stroke-width="1"/>

    <text x="34" y="254">パック1回分</text>
    <text x="300" y="254" text-anchor="end">800</text>
    <text x="470" y="254" text-anchor="end">1.8 MB</text>
    <text x="700" y="254" text-anchor="end">82万</text>

    <text x="34" y="276" font-weight="bold">7日窓（本システム）</text>
    <text x="300" y="276" text-anchor="end" font-weight="bold">約 5,600</text>
    <text x="470" y="276" text-anchor="end" font-weight="bold">12.5 MB</text>
    <text x="700" y="276" text-anchor="end" font-weight="bold">570万</text>
    <line x1="24" y1="288" x2="836" y2="288" stroke="#000" stroke-width="1.2"/>
  </g>

  <text x="24" y="312" font-size="11" opacity="0.85">1日800件の流量を仮定。いずれも端末の記憶容量・計算量の制約には遠く、コーパスをクライアントへ配ることを妨げない。</text>
</svg>
