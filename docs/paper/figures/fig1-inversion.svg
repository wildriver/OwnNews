<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1" opacity="0.28"/>
    </pattern>
  </defs>

  <g font-size="15" text-anchor="middle" font-weight="bold">
    <text x="220" y="24">(a) 一般的なニュース推薦</text>
    <text x="700" y="24">(b) OwnNews</text>
  </g>

  <line x1="460" y1="40" x2="460" y2="390" stroke="#000" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/>

  <!-- ================= (a) 従来型 ================= -->
  <g>
    <rect x="40" y="46" width="360" height="176" fill="none" stroke="#000" stroke-width="1.6"/>
    <text x="52" y="68" font-size="13" font-weight="bold">事業者のサーバ</text>

    <rect x="62" y="84" width="150" height="46" fill="#fff" stroke="#000"/>
    <text x="137" y="105" font-size="12.5" text-anchor="middle">記事DB</text>
    <text x="137" y="121" font-size="10.5" text-anchor="middle" opacity="0.75">候補の決定権</text>

    <rect x="228" y="84" width="150" height="46" fill="#fff" stroke="#000"/>
    <text x="303" y="112" font-size="12.5" text-anchor="middle">推薦エンジン</text>

    <rect x="62" y="150" width="316" height="50" fill="url(#hatch)" stroke="#000" stroke-width="1.6"/>
    <text x="220" y="171" font-size="12.5" text-anchor="middle" font-weight="bold">閲覧履歴・関心の集約</text>
    <text x="220" y="189" font-size="10.5" text-anchor="middle">全利用者ぶんが事業者側に蓄積される</text>

    <rect x="130" y="292" width="180" height="62" fill="#fff" stroke="#000" stroke-width="1.6"/>
    <text x="220" y="318" font-size="13" text-anchor="middle" font-weight="bold">利用者の端末</text>
    <text x="220" y="337" font-size="11.5" text-anchor="middle">表示のみ</text>

    <line x1="176" y1="292" x2="176" y2="204" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="168" y="252" font-size="11" text-anchor="end">閲覧履歴</text>

    <line x1="266" y1="222" x2="266" y2="288" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="274" y="252" font-size="11">順位付け済みの記事</text>
  </g>

  <!-- ================= (b) OwnNews ================= -->
  <g>
    <rect x="520" y="46" width="360" height="130" fill="none" stroke="#000" stroke-width="1.6"/>
    <text x="532" y="68" font-size="13" font-weight="bold">サーバ（全利用者に同一の出力）</text>

    <rect x="542" y="84" width="150" height="46" fill="#fff" stroke="#000"/>
    <text x="617" y="105" font-size="12.5" text-anchor="middle">記事DB（7日）</text>
    <text x="617" y="121" font-size="10.5" text-anchor="middle" opacity="0.75">集約層＝CEEK.JP</text>

    <rect x="708" y="84" width="150" height="46" fill="#fff" stroke="#000"/>
    <text x="783" y="105" font-size="12.5" text-anchor="middle">共通の前処理</text>
    <text x="783" y="121" font-size="10.5" text-anchor="middle" opacity="0.75">埋め込み・栄養素</text>

    <text x="700" y="152" font-size="11.5" text-anchor="middle">個人化を含まない</text>

    <line x1="700" y1="176" x2="700" y2="214" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="710" y="199" font-size="11">記事パック（全員共通・843 KB）</text>

    <rect x="520" y="220" width="360" height="150" fill="none" stroke="#000" stroke-width="1.6"/>
    <text x="532" y="242" font-size="13" font-weight="bold">利用者の端末</text>

    <rect x="542" y="256" width="150" height="44" fill="#fff" stroke="#000"/>
    <text x="617" y="276" font-size="12.5" text-anchor="middle">記事キャッシュ</text>
    <text x="617" y="292" font-size="10.5" text-anchor="middle" opacity="0.75">7日窓（サーバと同一）</text>

    <rect x="708" y="256" width="150" height="44" fill="#fff" stroke="#000"/>
    <text x="783" y="282" font-size="12.5" text-anchor="middle">推薦エンジン</text>

    <rect x="542" y="312" width="316" height="44" fill="url(#hatch)" stroke="#000" stroke-width="1.6"/>
    <text x="700" y="331" font-size="12.5" text-anchor="middle" font-weight="bold">閲覧履歴・関心ベクトル</text>
    <text x="700" y="348" font-size="10.5" text-anchor="middle">端末内に留まる</text>
  </g>

  <text x="460" y="396" font-size="11" text-anchor="middle" opacity="0.8">網掛けは閲覧履歴・関心情報の所在を示す</text>
</svg>
